# Seeding entry for CHAP. Copy this file into chap-core's config/configured_models/
# (e.g. as configurable_baseline_model.yaml) to seed the model and its configurations.
# The version is a model-code commit; a file cannot reference its own commit, so the
# sha below always points at an earlier commit. Add a new label when the model code changes.

- url: https://github.com/chap-models/configurable_baseline_model
  versions:
    v1: "@dc0d64927f9e1dc2c86cff5915c9bd0b08151e23"  # point forecast + Gaussian log noise
    v2: "@ea9ed02143b3f5045ff6ca9afee4d5793a76da3c"  # seasonal shift persistence samples, spread factor
  configurations:
    # Identical to CHAP's built-in seasonal_shift_persistence.
    baseline:
      user_option_values:
        spread_factor: 1.0
        log_bias: 0.0
    # About 35% too high and 26% too low.
    biased_over:
      user_option_values:
        log_bias: 0.3
    biased_under:
      user_option_values:
        log_bias: -0.3
    # Point forecast at the median, half and double the log-space spread.
    point:
      user_option_values:
        spread_factor: 0.0
    narrow:
      user_option_values:
        spread_factor: 0.5
    wide:
      user_option_values:
        spread_factor: 2.0
